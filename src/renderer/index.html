<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>RGA Tools</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="tb-brand"><img src="assets/icon.png" alt="" /><span>RGA Tools</span><small id="tb-ver"></small></div>
    <div class="tb-center" id="tb-center"></div>
    <div class="tb-controls">
      <button class="tb-btn" id="btn-theme" title="Thème clair / sombre"></button>
      <button class="tb-btn" id="btn-min" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button class="tb-btn" id="btn-max" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
      <button class="tb-btn tb-close" id="btn-close" title="Fermer"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><img id="side-logo" src="assets/logo-rga.png" alt="RGA Informatique" /></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="main">
      <div class="page" id="page"></div>
      <section class="console collapsed" id="console">
        <div class="console-head">
          <button class="console-toggle" id="console-toggle" title="Afficher / masquer le journal">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
            <span>Journal</span><span class="console-count" id="console-count">0</span>
          </button>
          <div class="gprog">
            <div class="gprog-label" id="gprog-label">Prêt</div>
            <div class="bar"><div class="bar-fill" id="gprog-fill"></div></div>
            <div class="gprog-pct" id="gprog-pct"></div>
          </div>
          <button class="ghost sm" id="console-clear">Effacer</button>
        </div>
        <div class="console-body" id="console-body"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div class="modal-actions"><button class="ghost" id="modal-cancel">Annuler</button><button class="primary" id="modal-ok">Confirmer</button></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
